<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<body style="font:15px -apple-system,Segoe UI,Roboto,sans-serif;color:#7d7f85;text-align:center;padding:40px 16px">
Загрузка…
<script>
// Загрузчик: этот файл не меняется. Само приложение (app.html) каждый раз берётся свежим, мимо кэша Telegram.
fetch('app.html?v=' + Date.now(), { cache: 'no-store' })
  .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
  .then(function (html) { document.open(); document.write(html); document.close(); })
  .catch(function (e) { document.body.textContent = 'Нет связи с сервером: ' + e.message + '. Закройте и откройте снова.'; });
</script>
</body>
</html>
